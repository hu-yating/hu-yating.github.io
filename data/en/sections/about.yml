# a summary about you
summary: "I'm a Data Scientist with a passion for turning complex data into practical, real-world solutions. My background is rooted in machine learning, natural language processing (NLP), and the growing field of generative AI (GenAI). Lately, I’ve been working a lot with large language models (LLMs), prompt engineering, and fine-tuning foundation models to help businesses innovate faster. I enjoy building models that not only predict outcomes but also create opportunities — whether that's improving decision-making, streamlining operations, or developing entirely new products. Along the way, I stay focused on Responsible AI practices, ensuring that the solutions I deliver are ethical, explainable, and built for the real world. I'm always exploring new tools, techniques, and ideas, and I love collaborating with teams who see data not just as information, but as a strategic advantage."
